name: probe
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - uses: ./probe-action
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
